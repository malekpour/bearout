# SPDX-License-Identifier: Apache-2.0
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["title", "kind", "interfaces"]

[properties.title]
type = "string"
minLength = 1

[properties.kind]
enum = ["io", "compute", "comm", "power"]

[properties.interfaces]
type = "array"
minItems = 1
uniqueItems = true
items = { type = "string" }
"x-bearout" = { ref = "example/engineering-evidence/interface@1" }

[properties.figures]
type = "array"
uniqueItems = true
items = { type = "string" }
"x-bearout" = { ref = "example/engineering-evidence/measurement@1" }
