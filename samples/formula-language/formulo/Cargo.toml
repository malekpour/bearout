# SPDX-License-Identifier: Apache-2.0
# Hand-written shell of the generated Formulo crate. Everything under
# src/generated and tests is produced by Bearout from the resource graph.

[package]
name = "formulo"
version = "0.1.0"
edition = "2024"
description = "Formulo, a spreadsheet-expression language generated by the Bearout formula-language sample"
license = "Apache-2.0"
publish = false

[dependencies]

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"
