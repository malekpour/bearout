"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["kind", "chapter", "variant"]

[properties.kind]
enum = ["literal", "identifier", "reference", "punctuator", "keyword"]

[properties.text]
type = "string"
minLength = 1

[properties.pattern]
type = "string"
minLength = 1

[properties.variant]
type = "string"
pattern = "^[A-Z][A-Za-z0-9]*$"

[properties.chapter]
type = "string"
"x-bearout" = { ref = "example/formula-language/chapter@1" }
