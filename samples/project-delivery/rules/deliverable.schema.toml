# SPDX-License-Identifier: Apache-2.0
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["title", "project", "milestone", "acceptance_days"]

[properties.title]
type = "string"
minLength = 1

[properties.project]
type = "string"
"x-bearout" = { ref = "example/project-delivery/project@1" }

[properties.milestone]
type = "string"
"x-bearout" = { ref = "example/project-delivery/milestone@1" }

[properties.acceptance_days]
type = "integer"
minimum = 1
maximum = 30

["x-bearout"]
sections = ["Acceptance criteria"]
