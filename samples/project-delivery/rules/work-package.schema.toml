"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["title", "project", "owner", "sequence"]

[properties.title]
type = "string"
minLength = 1

[properties.project]
type = "string"
"x-bearout" = { ref = "example/project-delivery/project@1" }

[properties.owner]
type = "string"
"x-bearout" = { ref = "example/project-delivery/participant@1" }

[properties.sequence]
type = "integer"
minimum = 1
