# Shape of a convention record: a title and a `Rule` section.

"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["title"]

[properties.title]
type = "string"
minLength = 1

["x-bearout"]
sections = ["Rule"]
