# SPDX-License-Identifier: Apache-2.0
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["esperanto", "english", "rules", "source", "locator"]

[properties.esperanto]
type = "string"
minLength = 1

[properties.english]
type = "string"
minLength = 1

[properties.rules]
type = "array"
minItems = 1
uniqueItems = true
items = { type = "string" }
"x-bearout" = { ref = "example/esperanto-reference/rule@1" }

[properties.source]
type = "string"
"x-bearout" = { ref = "example/esperanto-reference/source@1" }

[properties.locator]
type = "string"
minLength = 1
