# Exact tool versions used by local development, Git hooks, and CI.

min_version = "2026.9.1"

[settings]
lockfile = true

[tools]
rust = { version = "1.98.0", components = "rustfmt,clippy" }  # rustc, Cargo, rustfmt, and Clippy
rumdl = "0.2.62"  # Markdown linting and formatting
tombi = "1.5.0"  # TOML linting and formatting
prek = "0.5.1"  # Git hook runner

[tasks.setup]
description = "Install the pinned toolchain and the Git hooks"
run = ["mise install", "prek install"]

[tasks.check]
description = "Run every check used by CI"
# The Cargo-bearing tasks form one chain (lint -> test -> check:generated) so
# they never contend for the build lock; the tool-only checks run alongside.
depends = ["check:format", "check:whitespace", "check:hooks", "check:generated"]

[tasks."check:format"]
description = "Verify Rust, Markdown, and TOML formatting"
run = ["cargo fmt --all -- --check", "rumdl check .", "tombi format --check"]

[tasks."check:whitespace"]
description = "Reject trailing whitespace and missing final newlines in every tracked or untracked, non-ignored file"
run = "sh tools/check-whitespace.sh"

[tasks."check:hooks"]
description = "Validate the Git hook configuration"
run = "prek validate-config prek.toml"

[tasks.lint]
description = "Run Clippy and TOML linting"
run = ["cargo clippy --locked --all-targets --all-features -- -D warnings", "tombi lint"]

[tasks.test]
description = "Run the Rust test suite, which includes every sample"
depends = ["lint"]
run = "cargo test --locked --all-targets --all-features"

[tasks."check:generated"]
description = "Compile and test the Rust crate generated by the formula-language sample"
depends = ["test"]
env = { CARGO_TARGET_DIR = "target/formulo" }
run = [
  "cargo fmt --check --manifest-path samples/formula-language/formulo/Cargo.toml",
  "cargo clippy --locked --all-targets --manifest-path samples/formula-language/formulo/Cargo.toml -- -D warnings",
  "cargo test --locked --manifest-path samples/formula-language/formulo/Cargo.toml",
]

[tasks.samples]
description = "Regenerate every sample's outputs (writes files; use after changing a sample)"
run = "for sample in samples/*/; do cargo run --quiet --locked -- generate \"$sample\" || exit 1; done"

[tasks.package]
description = "Inspect the crate as it would be packaged, without publishing"
run = "cargo package --locked --allow-dirty"

[tasks.fmt]
description = "Format Rust, Markdown, and TOML files"
run = ["cargo fmt --all", "rumdl fmt .", "tombi format"]
