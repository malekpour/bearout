# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: Repository checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: rust rumdl tombi prek

      - run: mise run check

  portability:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: rust

      # Path normalization, report rendering, sample freshness, and staged
      # delivery are covered by the test suite on every platform.
      - run: mise exec -- cargo test --locked --all-targets --all-features

      - run: mise exec -- cargo test --locked --manifest-path samples/formula-language/formulo/Cargo.toml
        env:
          CARGO_TARGET_DIR: target/formulo
