# SPDX-License-Identifier: Apache-2.0
#
# Builds release binaries for a version tag and attaches them, with SHA-256
# checksums, to the GitHub release for that tag. The tag must match the
# version in Cargo.toml, and the full repository check must pass first.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  verify:
    name: Verify tag and repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: rust rumdl tombi prek

      - name: Require the tag to match Cargo.toml
        run: |
          version=$(mise exec -- cargo pkgid | sed 's/.*#//')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2; exit 1; }

      - run: mise run check

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { inside = ($2 == v) ; next }
            inside { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          printf '\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          cat release-notes.md

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Bearout ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi

  assets:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: rust

      - run: mise exec -- cargo build --release --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="bearout-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir dist "$name"
          cp target/release/bearout LICENSE NOTICE.md README.md "$name"/
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bearout-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory dist, $name | Out-Null
          Copy-Item target/release/bearout.exe, LICENSE, NOTICE.md, README.md $name/
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          "$((Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower())  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    name: Publish to crates.io
    needs: [verify, assets]
    runs-on: ubuntu-24.04
    # Trusted publishing: crates.io accepts a short-lived token minted from
    # this workflow's OpenID Connect identity, so no API token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: rust

      - name: Skip versions that are already on crates.io
        id: probe
        run: |
          version=$(mise exec -- cargo pkgid | sed 's/.*#//')
          if curl -fsS -A "bearout-release-workflow" "https://crates.io/api/v1/crates/bearout/$version" >/dev/null; then
            echo "bearout $version is already published" >&2
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.probe.outputs.published == 'false'
        id: auth

      - run: mise exec -- cargo publish --locked
        if: steps.probe.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
